name: Scan Lighthouse (Federal)

on:
  # Run 6× per day at a 1-hour offset from the general Lighthouse workflow
  # (01:00, 05:00, 09:00, 13:00, 17:00, 21:00 UTC) to prevent simultaneous
  # validation-metadata artifact writes.  The general workflow runs at
  # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
  #
  # The federal seed has ~50,035 URLs (76 % of all URLs).  Dedicating a
  # separate workflow to it — running in parallel with the general workflow
  # via a different concurrency group — effectively doubles overall Lighthouse
  # throughput and cuts the time to complete a first full pass from ~31 days
  # to ~5 days when combined with the increased frequency and concurrency in
  # scan-lighthouse.yml.
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      rate_limit:
        description: 'Maximum Lighthouse runs per second (default: 0.5)'
        required: false
        default: '0.5'
        type: string
      concurrency:
        description: 'Maximum parallel Lighthouse processes (default: 5)'
        required: false
        default: '5'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within this many days (0 = re-scan all, 30 = monthly refresh)'
        required: false
        default: '30'
        type: string

# Separate concurrency group from the general Lighthouse workflow so both can
# run simultaneously.  cancel-in-progress: false ensures a long federal scan
# is never cancelled by a newer scheduled trigger.
concurrency:
  group: lighthouse-scan-federal
  cancel-in-progress: false

jobs:
  scan-lighthouse-federal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Lighthouse CLI
        run: |
          npm install -g lighthouse

      - name: Find latest metadata artifact run ID
        id: find-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api --paginate "/repos/${{ github.repository }}/actions/artifacts?per_page=100&name=validation-metadata" \
            --jq '.artifacts[] | select(.expired == false) | "\(.created_at) \(.workflow_run.id)"' \
            2>/dev/null | sort -rk1 | head -1 | awk '{print $2}' || echo "")
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          if [ -n "$RUN_ID" ]; then
            echo "Found validation-metadata artifact from run $RUN_ID"
          else
            echo "No validation-metadata artifact found — will start with fresh database"
          fi

      - name: Download previous metadata DB (if exists)
        if: steps.find-metadata.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: validation-metadata
          path: data/
          run-id: ${{ steps.find-metadata.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lighthouse scan (Federal seed)
        run: |
          python3 -m src.cli.scan_lighthouse \
            --country FEDERAL \
            --max-runtime 110 \
            --rate-limit "${{ github.event.inputs.rate_limit || '0.5' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '5' }}" \
            --skip-recently-scanned-days "${{ github.event.inputs.skip_recently_scanned_days || '30' }}" \
            --only-categories "performance,accessibility,best-practices,seo" \
            --throttling-method "provided" \
            2>&1 | tee lighthouse-federal-scan-output.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-federal-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            lighthouse-federal-scan-output.txt
            data/toon-seeds/federal_lighthouse.toon
          retention-days: 90
          if-no-files-found: warn

      - name: Update shared validation metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-metadata
          path: |
            data/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Display scan summary
        if: always()
        run: |
          echo "## Lighthouse Scan Summary (Federal)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lighthouse-federal-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 lighthouse-federal-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Seed: FEDERAL (~50,035 URLs)" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '0.5' }} runs/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Concurrency: ${{ github.event.inputs.concurrency || '5' }} parallel processes" >> $GITHUB_STEP_SUMMARY
          echo "- Skip recently scanned: ${{ github.event.inputs.skip_recently_scanned_days || '30' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
