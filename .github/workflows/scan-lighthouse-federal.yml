name: Scan Lighthouse (Federal)

on:
  # Run 6× per day at a 1-hour offset from the general Lighthouse workflow
  # (01:00, 05:00, 09:00, 13:00, 17:00, 21:00 UTC) to prevent simultaneous
  # validation-metadata artifact writes.  The general workflow runs at
  # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
  #
  # The federal seed has ~50,035 URLs (76 % of all URLs).  Dedicating a
  # separate workflow to it — running in parallel with the general workflow
  # via a different concurrency group — effectively doubles overall Lighthouse
  # throughput and cuts the time to complete a first full pass from ~31 days
  # to ~5 days when combined with the increased frequency and concurrency in
  # scan-lighthouse.yml.
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      rate_limit:
        description: 'Maximum Lighthouse runs per second (default: 0.5)'
        required: false
        default: '0.5'
        type: string
      concurrency:
        description: 'Maximum parallel Lighthouse processes (default: 5)'
        required: false
        default: '5'
        type: string
      skip_recently_scanned_days:
        description: 'Skip URLs scanned within this many days (0 = re-scan all, 30 = monthly refresh)'
        required: false
        default: '30'
        type: string
      federal_url_batch_count:
        description: 'Number of deterministic federal URL batches (default: 144)'
        required: false
        default: '144'
        type: string
      federal_url_batch_index:
        description: 'Zero-based federal URL batch index override (empty = auto-rotate)'
        required: false
        default: ''
        type: string

# Separate concurrency group from the general Lighthouse workflow so both can
# run simultaneously.  cancel-in-progress: false ensures a long federal scan
# is never cancelled by a newer scheduled trigger.
concurrency:
  group: lighthouse-scan-federal
  cancel-in-progress: false

jobs:
  scan-lighthouse-federal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Lighthouse CLI
        run: |
          npm install -g lighthouse

      - name: Find latest metadata artifact run ID
        id: find-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api --paginate "/repos/${{ github.repository }}/actions/artifacts?per_page=100&name=validation-metadata" \
            --jq '.artifacts[] | select(.expired == false) | "\(.created_at) \(.workflow_run.id)"' \
            2>/dev/null | sort -rk1 | head -1 | awk '{print $2}' || echo "")
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          if [ -n "$RUN_ID" ]; then
            echo "Found validation-metadata artifact from run $RUN_ID"
          else
            echo "No validation-metadata artifact found — will start with fresh database"
          fi

      - name: Download previous metadata DB (if exists)
        if: steps.find-metadata.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: validation-metadata
          path: data/
          run-id: ${{ steps.find-metadata.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lighthouse scan (Federal seed)
        env:
          FEDERAL_URL_BATCH_COUNT: ${{ github.event.inputs.federal_url_batch_count || '144' }}
          FEDERAL_URL_BATCH_INDEX: ${{ github.event.inputs.federal_url_batch_index || '' }}
        run: |
          if ! [[ "$FEDERAL_URL_BATCH_COUNT" =~ ^[0-9]+$ ]] || [ "$FEDERAL_URL_BATCH_COUNT" -lt 1 ]; then
            echo "federal_url_batch_count must be a positive integer" >&2
            exit 1
          fi

          if [ -n "$FEDERAL_URL_BATCH_INDEX" ]; then
            if ! [[ "$FEDERAL_URL_BATCH_INDEX" =~ ^[0-9]+$ ]] || [ "$FEDERAL_URL_BATCH_INDEX" -ge "$FEDERAL_URL_BATCH_COUNT" ]; then
              echo "federal_url_batch_index must be an integer in [0, $((FEDERAL_URL_BATCH_COUNT - 1))]" >&2
              exit 1
            fi
            URL_BATCH_INDEX="$FEDERAL_URL_BATCH_INDEX"
            echo "Using manual federal URL batch index: $URL_BATCH_INDEX"
          else
            URL_BATCH_INDEX="$(python3 - "$FEDERAL_URL_BATCH_COUNT" <<'PY'
          from datetime import datetime, timezone
          import sys

          batch_count = int(sys.argv[1])
          now = datetime.now(timezone.utc)
          # Scheduled federal runs execute in 6 UTC slots/day: 01,05,09,13,17,21
          # (matching this workflow's cron schedule).
          # Map each slot to a deterministic per-day increment [0..5].
          # Manual runs may not match a scheduled slot; those default to slot 0.
          slots = {1: 0, 5: 1, 9: 2, 13: 3, 17: 4, 21: 5}
          slot_index = slots.get(now.hour, 0)
          # Monotonic cycle counter: increments once per schedule slot (6/day), then
          # rotates through all URL batches via modulo.
          cycle_number = (now.toordinal() * 6) + slot_index
          print(cycle_number % batch_count)
          PY
          )"
            echo "Auto-selected federal URL batch index: $URL_BATCH_INDEX"
          fi

          echo "FEDERAL_URL_BATCH_COUNT=$FEDERAL_URL_BATCH_COUNT" >> "$GITHUB_ENV"
          echo "FEDERAL_URL_BATCH_INDEX=$URL_BATCH_INDEX" >> "$GITHUB_ENV"

          python3 -m src.cli.scan_lighthouse \
            --country FEDERAL \
            --max-runtime 110 \
            --rate-limit "${{ github.event.inputs.rate_limit || '0.5' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '5' }}" \
            --skip-recently-scanned-days "${{ github.event.inputs.skip_recently_scanned_days || '30' }}" \
            --url-batch-count "$FEDERAL_URL_BATCH_COUNT" \
            --url-batch-index "$URL_BATCH_INDEX" \
            --only-categories "performance,accessibility,best-practices,seo" \
            --throttling-method "provided" \
            2>&1 | tee lighthouse-federal-scan-output.txt

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-federal-scan-${{ github.run_number }}
          path: |
            data/metadata.db
            lighthouse-federal-scan-output.txt
            data/toon-seeds/federal_lighthouse.toon
          retention-days: 90
          if-no-files-found: warn

      - name: Update shared validation metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-metadata
          path: |
            data/metadata.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Display scan summary
        if: always()
        run: |
          SUMMARY_BATCH_COUNT="${FEDERAL_URL_BATCH_COUNT:-1}"
          SUMMARY_BATCH_INDEX="${FEDERAL_URL_BATCH_INDEX:-0}"
          if ! [[ "$SUMMARY_BATCH_COUNT" =~ ^[0-9]+$ ]] || [ "$SUMMARY_BATCH_COUNT" -lt 1 ]; then
            SUMMARY_BATCH_COUNT=1
          fi
          if ! [[ "$SUMMARY_BATCH_INDEX" =~ ^[0-9]+$ ]]; then
            SUMMARY_BATCH_INDEX=0
          fi
          echo "## Lighthouse Scan Summary (Federal)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lighthouse-federal-scan-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 lighthouse-federal-scan-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Seed: FEDERAL (~50,035 URLs)" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limit: ${{ github.event.inputs.rate_limit || '0.5' }} runs/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Concurrency: ${{ github.event.inputs.concurrency || '5' }} parallel processes" >> $GITHUB_STEP_SUMMARY
          echo "- Skip recently scanned: ${{ github.event.inputs.skip_recently_scanned_days || '30' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- Federal URL batch: $((SUMMARY_BATCH_INDEX + 1))/$SUMMARY_BATCH_COUNT (0-based index: $SUMMARY_BATCH_INDEX)" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
