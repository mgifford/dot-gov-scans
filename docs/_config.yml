title: US Government Website Scans
description: >-
  Accessibility statement discovery and social media usage tracking
  for United States government websites.
baseurl: "/dot-gov-scans"
url: "https://mgifford.github.io"

# Theme - minima is the default GitHub Pages supported theme
theme: minima

# Plugins used by the site (see Gemfile's :jekyll_plugins group)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation links shown in the site header
header_pages:
  - index.md
  - scan-progress.md
  - social-media.md
  - accessibility-statements.md
  - technology-scanning.md
  - third-party-tools.md
  - domains.md
  - api.md

# Markdown processor
markdown: kramdown

# Show post dates
minima:
  date_format: "%Y-%m-%d"
